
<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>User</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<form th:action="@{/users/{userId}/update(userId=${user.id})}" method="post" th:object="${user}">
    <label for="username">Username:
        <input id="username" type="text" name="username" th:value="${user.username}">
    </label><br>
    <lable for="birthDate">BirthDate:
        <input type="date" name="birthDate" id="birthDate" th:value="*{birthDate}">
    </lable><br>
    <lable for="firstname">Lastname:
        <input type="text" name="firstname" id="firstname" th:value="*{firstname}">
    </lable><br>
    <lable for="lastname">Lastname:
        <input type="text" name="lastname" id="lastname" th:value="*{lastname}">
    </lable><br>
    <div th:each="role : ${roles}">
        <input type="radio" th:id="${role}" name="role" th:value="${role}" th:checked="${role == user.role}" >
        <label th:for="${role}" th:text="${role}">Role name</label>
    </div>
    <div>
        <lable for="company">Company:
            <select name="companyId" id="company">
                <option th:each="company : ${companies}"
                        th:value="${company.id}"
                        th:selected="${company.id == user.companyId.id}"
                        th:text="${company.name}">Company</option>
            </select>
        </lable>
    </div>
    <button type="submit">Update</button>
</form>
<form th:action="@{/users/{userId}/delete(userId=${user.id})}" th:if="${user.role.name() == 'ADMIN'}" method="post">
    <button type="submit">Remove</button>
</form>
</body>
</html>
