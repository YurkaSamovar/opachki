<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<body>
<div style="color: red" th:if="${param.error}">
    invalid usrname or password
</div>

<nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">Rechévén</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active text-white" aria-current="page" href="/">Accueil</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<form th:action="@{/users/registration}" method="post" th:object="${user}">
    <label for="mail">Mail:
        <input id="mail" type="email" class="form-control" name="mail" th:value="${user.mail}" required>
    </label><br>
    <label for="username">Username:
        <input id="username" type="text" class="form-control" name="username" th:value="${user.username}" required>
    </label><br>
    <lable for="password">Mot de passe:
        <input type="password" name="password" id="passwor" required>
    </lable><br>
    <lable for="firstname">Prénom:
        <input type="text" name="firstname" id="firstname" th:value="*{firstname}" required>
    </lable><br>
    <lable for="lastname">Nom:
        <input type="text" name="lastname" id="lastname" th:value="*{lastname}" required>
    </lable><br>
    <lable for="birthDate">La date de naissance:
        <input type="date" name="birthDate" id="birthDate" th:value="*{birthDate}">
    </lable><br>
</div>
    <button type="submit">Registrer</button>
</form>
<div th:if="${errors}">
    <p style="color: red" th:each="error : ${errors}" th:text="${error.defaultMessage}">Error message</p>
</div>
</body>
</html>
