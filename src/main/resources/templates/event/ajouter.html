<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body >
<nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">Rechévén</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active text-white" aria-current="page" href="#">Accueil</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <button class="btn btn-warning" type="submit">Régistrer</button>
            </form>
        </div>
    </div>
</nav>

<div class="container bg-light">
    <form action="/event/add" method="POST" enctype="multipart/form-data">
        <span for="title">Title</span> <br>
        <input type="text" class="form-control" aria-describedby="title" name="title" id="title">

        <label for="image">Image</label> <br>
        <input type="file" class="form-control" name="image" id="image">

        <label class="col-4" for="prix">Le prix</label> <br>
        <input type="number" class="form-controle" id="prix" name="prix"> <br>

        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="5"></textarea>

        <label for="adresse">Date</label> <br>
        <input type="date" class="form-control" aria-describedby="title" name="date" id="date">

        <label for="adresse">Adresse</label> <br>
        <input type="text" class="form-control" aria-describedby="title" name="adresse" id="adresse">

        <label for="adresse">Link</label> <br>
        <input type="text" class="form-control" aria-describedby="title" name="link" id="link">

        <label for="adresse">Choisir la thème</label> <br>
        <select class="custom-select col" id="theme" name="theme">
            <option value="1">Fêtes</option>
            <option value="2">Concert</option>
            <option value="3">Art et culture</option>
            <option value="4">Pour les enfants</option>
        </select>

        <button type="submit" class="btn btn-info col-12 mt-2">Crérer</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
