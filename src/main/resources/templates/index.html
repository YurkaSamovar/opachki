<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">Rechévén</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active text-white" aria-current="page" href="#">Accueil</a>
                </li>
            </ul>
            <a href="/event" class="mr-2">
                <button class="btn btn-primary " type="submit">Ajouter un événement</button>
            </a>
            <form class="d-flex" role="search">
                <button class="btn btn-warning" type="submit">Régistrer</button>
            </form>
        </div>
    </div>
</nav>
<div class="container-fluide">
    <div class="row">
        <div class="col-1"></div>
        <div class="col-2 bg-success">
            <h3>Filter</h3>
            <div class="filter">
                <form action="/" class="gy-2 container" method="get">
                    <div class="row">
                        <label class="col-4" for="theme">Thèmes</label>
                        <select class="custom-select col" id="theme" name="theme" th:selected="3">
                            <option th:each="theme : ${themes}"
                                    th:value="${theme.id}"
                                    th:selected="(${filter.theme()} == *{theme.id})"
                                    th:text="${theme.name}">theme</option>
                        </select>
                    </div>
                    <div class="row mt-2">
                        <!-- Здесь можно использовать datetime-local -->
                        <label class="col-4" for="de">De</label>
                        <input type="date" class="col" id="de" name="date" autocomplete="off" th:value="${filter.date()}">
                    </div>
                    <div class="row mt-2">
                        <label class="col-4" for="prix">Le prix</label>
                        <select class="custom-select col" id="prix" name="prix">
                            <option value="0">Gratuitement</option>
                            <option value="10">Jusqu'à 10</option>
                            <option value="50">Jusqu'à 50</option>
                            <option value="999999">plus de 100</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-info col-12 mt-2">Fltrer</button>
                </form>
            </div>
        </div>
        <div class="col-8 bg-warning">
            <h2 class="text-center">Contenu</h2>
            <div class="row d-flex justify-content-around gy-3">
                <div class="card col-5" th:each="card : ${cards}">
                    <img th:src="@{'image/' + ${card.image}}" class="card-img-top" alt="артуха">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${card.title}">Title</h5>
                        <p class="card-text" th:text="${card.description}">Description</p>
                        <p class="card-text" th:text="${card.prix}">Prix</p>
                        <a href="#" class="btn btn-primary">En savoir plus</a>
                    </div>
            </div>
        </div>
        <div class="col-1"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
